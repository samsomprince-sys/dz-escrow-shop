<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الجزائر - Escrow Server Mode</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #182533; --text-color: #ffffff; --hint-color: #7e91a4;
            --btn-color: #2f6ea5; --secondary-bg: #101921;
        }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 15px; margin: 0; }
        .nav-tabs { display: flex; background: var(--secondary-bg); padding: 5px; border-radius: 8px; margin-bottom: 20px; }
        .tab-btn { width: 50%; background: none; border: none; color: var(--hint-color); padding: 10px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: var(--btn-color); color: #fff; border-radius: 6px; }
        .tab-content { display: none; } .tab-content.active { display: block; }
        .product-card { background: var(--secondary-bg); padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: var(--btn-color); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn-danger { background: #e53935; }
        .form-control { width: 100%; padding: 10px; margin-bottom: 10px; background: var(--secondary-bg); color: white; border: 1px solid #233142; border-radius: 5px; box-sizing: border-box; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; }
        .modal-content { background: var(--bg-color); padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('buyer')">المتجر</button>
        <button class="tab-btn" onclick="switchTab('merchant')">لوحة التاجر</button>
    </div>

    <div id="buyer" class="tab-content active">
        <h3>المنتجات المتوفرة (من السيرفر)</h3>
        <div id="buyer-list">جاري تحميل المنتجات الحية...</div>
    </div>

    <div id="merchant" class="tab-content">
        <h3>إضافة منتج جديد بالسيرفر</h3>
        <input type="text" id="p-name" class="form-control" placeholder="اسم المنتج">
        <input type="number" id="p-price" class="form-control" placeholder="السعر بالدينار DA">
        <button class="btn" style="width:100%;" onclick="addProductToServer()">إضافة إلى السيرفر العام</button>
        <h3>المنتجات المتاحة للحذف</h3>
        <div id="merchant-list">جاري التحميل...</div>
    </div>

    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <h3>تأكيد الدفع (Escrow)</h3>
            <p>قم بتحويل المبلغ إلى حساب BaridiMob التالي:</p>
            <div style="background:#101921; padding:10px; text-align:center; color:#ffb74d; font-weight:bold; font-size:18px; margin-bottom:15px;">00799999002478845197</div>
            <input type="text" id="b-name" class="form-control" placeholder="اسمك الكامل">
            <input type="text" id="b-phone" class="form-control" placeholder="رقم هاتفك">
            <button class="btn" onclick="sendOrder()">إرسال الطلب للمشرف المعلق</button>
            <button class="btn btn-danger" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <script>
                // التأكد من وجود تليجرام أولاً لحماية الكود من التوقف خارج التطبيق
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null; 
        if(tg) tg.expand();

        
        // ⚠️ استبدل هذا الرابط برابط الـ Ngrok التابع للمنفذ 3000 الخاص بالـ Backend
        const API_URL = window.location.origin; 
        
        let products = [];
        let selectedProduct = null;

                // دالة جلب البيانات الذكية بعد تنظيف روابط تليجرام
        async function fetchProducts() {
            try {
                // تنظيف الرابط وإزالة أي علامة مائلة زائدة من النهاية
                let cleanUrl = window.location.origin.replace(/\/$/, "");
                
                const res = await fetch(`${cleanUrl}/api/products`);
                products = await res.json();
                render();
            } catch (err) {
                document.getElementById('buyer-list').innerText = "خطأ في الاتصال بالسيرفر الخلفي.";
            }
        }


        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.currentTarget.classList.add('active');
            fetchProducts();
        }

        function render() {
            const bList = document.getElementById('buyer-list'); const mList = document.getElementById('merchant-list');
            bList.innerHTML = ''; mList.innerHTML = '';
            
            if(products.length === 0) {
                bList.innerHTML = "<p style='text-align:center;color:var(--hint-color)'>لا توجد منتجات حالياً.</p>";
                return;
            }

            products.forEach(p => {
                bList.innerHTML += `<div class="product-card"><div><b>${p.name}</b><br><span style="color:#4caf50">${p.price} DA</span></div><button class="btn" onclick="openModal(${p.id})">اطلب</button></div>`;
                mList.innerHTML += `<div class="product-card"><div><b>${p.name}</b><br>${p.price} DA</div><button class="btn btn-danger" onclick="deleteProductFromServer(${p.id})">حذف</button></div>`;
            });
        }

        async function addProductToServer() {
            const name = document.getElementById('p-name').value; const price = document.getElementById('p-price').value;
            if(!name || !price) return alert('امْلأ الحقول!');
            
            await fetch(`${API_URL}/api/products`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, price })
            });

            document.getElementById('p-name').value = ''; document.getElementById('p-price').value = '';
            fetchProducts();
        }

        async function deleteProductFromServer(id) {
            await fetch(`${API_URL}/api/products/${id}`, { method: 'DELETE' });
            fetchProducts();
        }

        function openModal(id) { selectedProduct = products.find(p => p.id === id); document.getElementById('payment-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('payment-modal').style.display = 'none'; }
        
                        async function sendOrder() {
            const name = document.getElementById('b-name').value; 
            const phone = document.getElementById('b-phone').value;
            if(!name || !phone) return alert('أدخل بياناتك!');
            
            const orderData = {
                product: selectedProduct.name,
                price: selectedProduct.price,
                buyer: name,
                phone: phone
            };

            // جلب بيانات الأمان المشفرة تلقائياً من تطبيق تليجرام إذا كانت متوفرة
            const initDataString = tg && tg.initData ? tg.initData : "";

            try {
                // إرسال الطلب مع حزمة الأمان لحماية السيرفر
                await fetch(`${API_URL}/api/orders`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'telegram-init-data': initDataString // إرسال مفتاح الأمان للسيرفر لفحصه
                    },
                    body: JSON.stringify(orderData)
                });
                
                alert('تم إرسال طلبك بنجاح للمشرف! يرجى مراجعة محادثة البوت.');
                closeModal();
                if(tg) tg.close();
            } catch (err) {
                alert('خطأ في إرسال الطلب إلى السيرفر الخلفي.');
            }
        }



        // تحميل أولي للمنتجات من السيرفر
        fetchProducts();
    </script>
</body>
</html>
